name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libopenmpi-dev openmpi-bin freeglut3-dev libglu1-mesa-dev
      - name: Build and smoke test
        run: bash scripts/smoke.sh 200 2000 4
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: scripts/results/smoke.log
          if-no-files-found: ignore

  coloring-quality:
    # Colors used by the heuristics versus bounds on the chromatic number, on the thesis graphs.
    # Colors are deterministic, so these results are valid data (CI timings are not).
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        graph:
          - { name: G1, n: 1000, m: 30000, k: 16 }
          - { name: G2, n: 10000, m: 1500000, k: 32 }
          - { name: G3, n: 10000, m: 100000, k: 16 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libopenmpi-dev openmpi-bin freeglut3-dev libglu1-mesa-dev python3-venv
          python3 -m venv .venv && .venv/bin/pip install --quiet networkx "ortools==9.15.*"
      - name: Generate graph and run the sequential baselines
        run: |
          mkdir -p src/data scripts/results
          make -s -C src/generator && make -s -C src/algorithms/sequential
          (cd src/generator && ./a.out ${{ matrix.graph.n }} ${{ matrix.graph.m }} ${{ matrix.graph.k }})
          (cd src/algorithms/sequential && ./a.out ${{ matrix.graph.n }} ${{ matrix.graph.m }} ${{ matrix.graph.k }}) | tee scripts/results/sequential-${{ matrix.graph.name }}.log
      - name: Coloring quality
        run: |
          .venv/bin/python scripts/coloring_quality.py "src/data/${{ matrix.graph.n }} ${{ matrix.graph.m }} ${{ matrix.graph.k }}.txt" \
            --csv scripts/results/quality-${{ matrix.graph.name }}.csv --exact | tee scripts/results/quality-${{ matrix.graph.name }}.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.graph.name }}
          path: |
            scripts/results/quality-${{ matrix.graph.name }}.*
            scripts/results/sequential-${{ matrix.graph.name }}.log
          if-no-files-found: ignore

  communication-volume:
    # Bytes communicated per phase by v1 (components), the --replicate baseline and the root-free v2.
    # Volumes are deterministic for an instance and p, so they are valid data for hypothesis H1.
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libopenmpi-dev openmpi-bin freeglut3-dev libglu1-mesa-dev
      - name: Measure communication volume
        run: |
          mkdir -p src/data scripts/results
          for d in generator algorithms/mpi algorithms/mpi_v2; do make -s -C src/$d; done
          LOG=$PWD/scripts/results/volume.log
          : > "$LOG"
          # tagged <label> <command...>: runs the command and prefixes its VOLUME lines with the graph label
          tagged() { local label=$1; shift; "$@" | grep '^VOLUME,' | sed "s/^VOLUME,/VOLUME,$label,/" >> "$LOG"; }
          measure() {  # measure label n m k replicate_ps v_ps
            local label=$1 n=$2 m=$3 k=$4
            (cd src/generator && ./a.out "$n" "$m" "$k" > /dev/null)
            for p in $6; do
              tagged "$label" bash -c "cd src/algorithms/mpi && mpirun --oversubscribe -np $p ./a.out $n $m $k"
              tagged "$label" bash -c "cd src/algorithms/mpi_v2 && mpirun --oversubscribe -np $p ./a.out $n $m $k"
            done
            # Replication needs n^2 words per process, so it only runs where it fits in the runner's memory.
            for p in $5; do
              tagged "$label" bash -c "cd src/algorithms/mpi && mpirun --oversubscribe -np $p ./a.out $n $m $k --replicate"
            done
          }
          measure G1 1000 30000 16 "2 4 8 16" "2 4 8 16"
          measure G2 10000 1500000 32 "4" "4 16"
          # Permuted labels remove the locality of the contiguous layout (the honest case for v2).
          GRAPH_VARIANT="permute,seed=42" measure G1-permuted 1000 30000 16 "" "4 16"
          GRAPH_VARIANT="permute,seed=42" measure G2-permuted 10000 1500000 32 "" "4 16"
          { echo "graph,algorithm,n,m,k,p,h,bytes_dsu,bytes_pack,bytes_send,bytes_gather,bytes_total"; grep '^VOLUME,' "$LOG" | cut -d, -f2-; } | tee scripts/results/volume.csv
      - name: Block encodings and complement coloring
        run: |
          LOG=$PWD/scripts/results/encodings.log
          : > "$LOG"
          encodings() {  # encodings n m k
            for blocks in auto bitmap edges complement; do
              (cd src/algorithms/mpi_v2 && mpirun --oversubscribe -np 4 ./a.out "$1" "$2" "$3" --root --blocks=$blocks) | grep -E '^(CSV|VOLUME|BLOCKS),' >> "$LOG"
            done
            for color in matching cliques best; do
              (cd src/algorithms/mpi_v2 && mpirun --oversubscribe -np 4 ./a.out "$1" "$2" "$3" --root --blocks=complement --color=$color) | grep -E '^(CSV|BLOCKS),' >> "$LOG"
            done
          }
          encodings 1000 30000 16
          encodings 10000 1500000 32
          cat "$LOG"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: communication-volume
          path: |
            scripts/results/volume.*
            scripts/results/encodings.log
          if-no-files-found: ignore

  correctness-at-scale:
    # Correctness only (no timings): fuzzing of v2 against v1 on many seeds, and v2 on large
    # Zipf graphs with permuted labels, generated without the n x n matrix.
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libopenmpi-dev openmpi-bin freeglut3-dev libglu1-mesa-dev
      - name: Fuzz v2 against v1
        run: bash scripts/fuzz.sh 50
      - name: v2 on large permuted Zipf graphs
        run: |
          check() {  # check n m k p
            (cd src/generator && GRAPH_VARIANT="zipf=1.0,permute,seed=11" ./a.out "$1" "$2" "$3" --edges-only)
            out=$(cd src/algorithms/mpi_v2 && GRAPH_VARIANT="zipf=1.0,permute,seed=11" mpirun --oversubscribe -np "$4" ./a.out "$1" "$2" "$3")
            echo "$out" | grep -E "well colored|Components|^VOLUME"
            echo "$out" | grep -qx "Components: $3"
          }
          check 100000 2000000 64 4
          check 100000 2000000 64 16
          check 1000000 10000000 256 16

  real-graph-and-baselines:
    # A real disconnected graph (SNAP ca-GrQc) through every v2 distribution, and ColPack as an
    # external coloring baseline. Colors and component counts only; no timings.
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make cmake libopenmpi-dev openmpi-bin freeglut3-dev libglu1-mesa-dev python3
      - name: Real graph through every v2 distribution
        run: |
          mkdir -p src/data/real scripts/results
          make -s -C src/algorithms/mpi_v2
          curl -sSfL https://snap.stanford.edu/data/ca-GrQc.txt.gz | gunzip > src/data/real/ca-GrQc.txt
          read -r N M K < <(python3 scripts/convert_graph.py to-edges src/data/real/ca-GrQc.txt src/data/real/ca-GrQc.edges)
          echo "ca-GrQc: n=$N m=$M k=$K"
          export GRAPH_FILE=$PWD/src/data/real/ca-GrQc.edges
          LOG=$PWD/scripts/results/real.log
          : > "$LOG"
          cd src/algorithms/mpi_v2
          for args in "-np 1" "-np 4" "-np 4 --root" "-np 4 --root --blocks=bitmap" "-np 4 --root --blocks=edges --scatterv"; do
            set -- $args
            mpirun --oversubscribe "$1" "$2" ./a.out "$N" "$M" "$K" "${@:3}" | tee -a "$LOG"
          done
          [[ $(grep -c "Components: $K" "$LOG") -eq 5 ]]
          [[ $(grep '^CSV,' "$LOG" | cut -d, -f14 | sort -u | wc -l) -eq 1 ]]
          echo "== ca-GrQc: every distribution finds $K components and the same colors"
      - name: ColPack baseline
        run: |
          bash scripts/baselines.sh
          mkdir -p src/data
          make -s -C src/generator && (cd src/generator && ./a.out 1000 30000 16 > /dev/null)
          python3 scripts/convert_graph.py to-mtx "src/data/1000 30000 16.edges" scripts/results/G1.mtx
          python3 scripts/convert_graph.py to-mtx src/data/real/ca-GrQc.edges scripts/results/ca-GrQc.mtx
          for g in G1 ca-GrQc; do
            src/baselines/colpack/driver scripts/results/$g.mtx | sed "s/^/$g,/" | tee -a scripts/results/colpack.csv
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-graph-and-baselines
          path: |
            scripts/results/real.log
            scripts/results/colpack.csv
          if-no-files-found: ignore

  load-balance:
    # Work model of coloring by components (deterministic, no timings): speedup ceiling W / w_max
    # and the speedup of the contiguous and LPT assignments, on balanced, Zipf and real graphs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make freeglut3-dev libglu1-mesa-dev python3
      - name: Generate graphs
        run: |
          mkdir -p src/data/real scripts/results
          make -s -C src/generator
          cd src/generator
          ./a.out 1000 30000 16 --edges-only
          ./a.out 10000 1500000 32 --edges-only
          GRAPH_VARIANT="zipf=0.5" ./a.out 10000 1998761 32 --edges-only
          GRAPH_VARIANT="zipf=1.0" ./a.out 10000 4793190 32 --edges-only
          cd ../..
          curl -sSfL https://snap.stanford.edu/data/ca-GrQc.txt.gz | gunzip > src/data/real/ca-GrQc.txt
          python3 scripts/convert_graph.py to-edges src/data/real/ca-GrQc.txt src/data/real/ca-GrQc.edges
      - name: Load balance
        run: |
          python3 scripts/load_balance.py \
            "G1=src/data/1000 30000 16.edges" \
            "G2=src/data/10000 1500000 32.edges" \
            "G2-zipf0.5=src/data/10000 1998761 32 zipf0.5.edges" \
            "G2-zipf1=src/data/10000 4793190 32 zipf1.edges" \
            "ca-GrQc=src/data/real/ca-GrQc.edges" \
            --csv scripts/results/load_balance.csv
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-balance
          path: scripts/results/load_balance.csv
          if-no-files-found: ignore

  quality-vs-density:
    # Coloring quality across the density of the components (deterministic, no timings): k = 8
    # components of 312 vertices with the same density; colors of LDF, matching and cliques (mpi_v2
    # with automatic blocks: bitmap below 15/16, complement above, and the complement methods on
    # both, since bitmap blocks of density >= 1/2 are complemented at the owner) and DSatur,
    # against the exact chromatic number from the clique packing (CP-SAT, 300 s per component).
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        density: ["0.80", "0.85", "0.90", "0.93", "0.95", "0.97", "0.98", "0.99", "0.995"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make libopenmpi-dev openmpi-bin freeglut3-dev libglu1-mesa-dev python3-venv
          python3 -m venv .venv && .venv/bin/pip install --quiet networkx "ortools==9.15.*"
      - name: Generate and color
        run: |
          K=8 NI=312 D=${{ matrix.density }}
          N=$((K * NI))
          M=$(python3 -c "print(round($D * $K * $NI * ($NI - 1) / 2))")
          echo "density $D: n=$N m=$M k=$K"
          mkdir -p src/data scripts/results
          make -s -C src/generator && make -s -C src/algorithms/mpi_v2
          (cd src/generator && ./a.out $N $M $K > /dev/null)
          LOG=$PWD/scripts/results/density-$D.log
          : > "$LOG"
          for color in ldf matching cliques; do
            (cd src/algorithms/mpi_v2 && mpirun --oversubscribe -np 4 ./a.out $N $M $K --root --color=$color) | grep -E '^(CSV|BLOCKS),' | tee -a "$LOG"
          done
          .venv/bin/python scripts/coloring_quality.py "src/data/$N $M $K.txt" --exact --time-limit 300 \
            --csv scripts/results/density-$D.csv | tee -a "$LOG"
          .venv/bin/python scripts/density_summary.py --density $D --log "$LOG" --quality scripts/results/density-$D.csv --header \
            | tee scripts/results/density-summary-$D.csv
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: density-${{ matrix.density }}
          path: scripts/results/density-*
          if-no-files-found: ignore

  components-baselines:
    # Correctness cross-check of the number of connected components against external connectivity
    # codes, and the wiring for timing them on Khipu (no timings here): FastSV and LACC (CombBLAS,
    # distributed memory, square process grid) and ConnectIt and the work-efficient algorithm of
    # Shun, Dhulipala and Blelloch (GBBS, shared memory). Pinned commits.
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      USE_BAZEL_VERSION: 8.2.1
      COMBBLAS_COMMIT: 2381a1f7a028b9f56d8531c0b7b157ae2ab27572
      GBBS_COMMIT: bd48872385ad907010417bfa939f4fca04e563b8
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make cmake libopenmpi-dev openmpi-bin freeglut3-dev libglu1-mesa-dev python3
      - name: Generate and convert graphs
        run: |
          mkdir -p src/data/real scripts/results/baselines
          make -s -C src/generator && make -s -C src/algorithms/mpi_v2
          cd src/generator
          ./a.out 10000 1500000 32 --edges-only
          GRAPH_VARIANT="zipf=1.0" ./a.out 10000 4793190 32 --edges-only
          GRAPH_VARIANT="permute,seed=42" ./a.out 1000000 4000000 1000 --edges-only
          cd ../..
          curl -sSfL https://snap.stanford.edu/data/ca-GrQc.txt.gz | gunzip > src/data/real/ca-GrQc.txt
          python3 scripts/convert_graph.py to-edges src/data/real/ca-GrQc.txt src/data/real/ca-GrQc.edges
          # name|n|m|k|edges file
          {
            echo "G2|10000|1500000|32|src/data/10000 1500000 32.edges"
            echo "G2-zipf1|10000|4793190|32|src/data/10000 4793190 32 zipf1.edges"
            echo "large-permuted|1000000|4000000|1000|src/data/1000000 4000000 1000 perm42.edges"
            echo "ca-GrQc|5242|14484|355|src/data/real/ca-GrQc.edges"
          } > scripts/results/baselines/graphs.txt
          while IFS='|' read -r name n m k file; do
            python3 scripts/convert_graph.py to-mtx "$file" "scripts/results/baselines/$name.mtx"
            python3 scripts/convert_graph.py to-adj "$file" "scripts/results/baselines/$name.adj"
          done < scripts/results/baselines/graphs.txt
      - name: Build FastSV and LACC (CombBLAS)
        run: |
          git init -q third_party/CombBLAS
          git -C third_party/CombBLAS fetch -q --depth 1 https://github.com/PASSIONLab/CombBLAS.git "$COMBBLAS_COMMIT"
          git -C third_party/CombBLAS checkout -q FETCH_HEAD
          printf 'ADD_EXECUTABLE( fastsv FastSV.cpp )\nTARGET_LINK_LIBRARIES( fastsv CombBLAS)\n' >> third_party/CombBLAS/Applications/CMakeLists.txt
          cmake -S third_party/CombBLAS -B third_party/CombBLAS/_build -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build third_party/CombBLAS/_build --target fastsv lacc -j4 > /dev/null
      - name: Build ConnectIt and SDB14 (GBBS)
        run: |
          git init -q third_party/gbbs
          git -C third_party/gbbs fetch -q --depth 1 https://github.com/ParAlg/gbbs.git "$GBBS_COMMIT"
          git -C third_party/gbbs checkout -q FETCH_HEAD
          cd third_party/gbbs
          bazel build -c opt //benchmarks/Connectivity/WorkEfficientSDB14:Connectivity_main \
            //benchmarks/Connectivity/ConnectIt/mains:unite_rem_cas_kout 2>&1 | tail -3
      - name: Number of components with every code
        run: |
          COMBBLAS=$PWD/third_party/CombBLAS/_build/Applications
          GBBS=$PWD/third_party/gbbs/bazel-bin/benchmarks/Connectivity
          DIR=$PWD/scripts/results/baselines
          OUT=$DIR/components.csv
          echo "graph,expected_k,code,components" > "$OUT"
          count() {  # count PATTERN COMMAND...: first number after PATTERN in stdout or stderr, or empty
            local pattern=$1
            shift
            "$@" < /dev/null 2>&1 | grep -o "$pattern [0-9]*" | head -1 | grep -o '[0-9]*$' || true
          }
          while IFS='|' read -r name n m k file; do
            ours=$(cd src/algorithms/mpi_v2 && count 'Components:' env GRAPH_FILE="$GITHUB_WORKSPACE/$file" mpirun --oversubscribe -np 4 ./a.out "$n" "$m" "$k")
            fastsv=$(count 'Number of components:' mpirun --oversubscribe -np 4 "$COMBBLAS/fastsv" -I mm -M "$DIR/$name.mtx")
            lacc=$(count 'Number of clusters:' mpirun --oversubscribe -np 4 "$COMBBLAS/lacc" -I mm -M "$DIR/$name.mtx")
            sdb=$(count 'n_cc =' "$GBBS/WorkEfficientSDB14/Connectivity_main" -s -stats -rounds 1 "$DIR/$name.adj")
            connectit=$(count 'correctness check:' "$GBBS/ConnectIt/mains/unite_rem_cas_kout" -s -check -rounds 1 "$DIR/$name.adj")
            for row in "mpi-v2,$ours" "fastsv,$fastsv" "lacc,$lacc" "gbbs-sdb14,$sdb" "connectit-check,$connectit"; do
              echo "$name,$k,$row" | tee -a "$OUT"
            done
          done < "$DIR/graphs.txt"
          # Every count must equal k, and ConnectIt must pass its own check against a BFS-based CC.
          awk -F, 'NR > 1 && $3 != "connectit-check" && $4 != $2 {bad++} NR > 1 && $3 == "connectit-check" && $4 != 1 {bad++} END {exit bad > 0}' "$OUT"
          echo "== every code finds the expected number of components"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: components-baselines
          path: scripts/results/baselines/components.csv
          if-no-files-found: ignore
